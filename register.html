<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AI Farming Assistant</title>

    <link rel="stylesheet" href="sty.css">
    <link rel="icon" href="logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">

        <img src="logo.png" class="logo">

        <a class="navbar-brand text-success fw-bold" href="#">
            AI Farming Assistant
        </a>

        <div class="ms-auto">
            <a href="index.html" class="btn btn-outline-success">
                Home
            </a>
        </div>

    </div>
</nav>

<section class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-6">

<div class="card shadow-lg border-0 p-4">

<div class="text-center">

<img src="logo.png" width="80">

<h3 class="text-success mt-3">
Create Account
</h3>

<p>Join AI Farming Assistant</p>

</div>

<form id="registerForm">

<div class="mb-3">

<label class="form-label">

Full Name

</label>

<input
type="text"
id="name"
class="form-control"
placeholder="Enter your full name"
required>

</div>

<div class="mb-3">

<label class="form-label">

Email

</label>

<input
type="email"
id="email"
class="form-control"
placeholder="Enter email"
required>

</div>

<div class="mb-3">

<label class="form-label">

Phone Number

</label>

<input
type="tel"
id="phone"
class="form-control"
placeholder="Enter phone number"
required>

</div>

<div class="mb-3">

<label class="form-label">

Password

</label>

<input
type="password"
id="password"
class="form-control"
placeholder="Create password"
required>

</div>

<div class="mb-3">

<label class="form-label">

Confirm Password

</label>

<input
type="password"
id="confirmPassword"
class="form-control"
placeholder="Confirm password"
required>

</div>

<button type="submit" class="btn btn-success w-100">Register</button>
<div class="text-center mt-3">Already have an account?
<a href="login.html">Login</a>
</div>
</form>
</div>
</div>
</div>
</section>
<script src="register.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
